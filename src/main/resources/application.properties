# ===================================================================
# 0. CONFIGURACIÓN GENERAL Y APLICACIÓN
# ===================================================================
spring.application.name=Segunda_Practica_Sprint
server.port=8080
spring.profiles.active=dev

# Propiedades tipadas para AppInfoProperties (prefijo app.info)
# app.info.version toma el valor dinámico del pom.xml mediante filtrado de recursos Maven
app.info.name=Segunda_Practica_Sprint
app.info.description=Segunda Practica de Spring Boot
app.info.version=@project.version@
app.info.developer=Sahid
app.info.email=sahid@espe.edu.ec
app.info.role=Developer
# Entorno base por defecto (sobrescrito por los perfiles específicos)
app.info.environment=default

# ===================================================================
# 1. SERVIDOR (SERVER)
# ===================================================================
# Oculta el mensaje de excepción en respuestas de error para no exponer detalles internos
server.error.include-message=never
# Permite que las conexiones activas finalicen ordenadamente antes de detener el servidor
server.shutdown=graceful

# ===================================================================
# 2. LOGS (LOGGING)
# ===================================================================
# Ruta y nombre del archivo donde se almacenan físicamente los logs del servidor
logging.file.name=logs/app.log

# ===================================================================
# 3. BASE DE DATOS (BDD) / JPA / JSON
# ===================================================================
# URL de conexión a la base de datos PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/mi_bd
# Usuario de acceso a la base de datos PostgreSQL
spring.datasource.username=postgres
# Contraseña de acceso a la base de datos PostgreSQL
spring.datasource.password=1234
# Evita que la aplicación falle al iniciar si PostgreSQL no está disponible (-1 deshabilita el timeout de fallo inicial de HikariCP)
spring.datasource.hikari.initialization-fail-timeout=-1
# Reduce el tiempo de espera a 1 segundo cuando la base de datos no está disponible para no retrasar el arranque
spring.datasource.hikari.connection-timeout=1000
# Especifica el dialecto explícito para que Hibernate no requiera conexión activa a la BD al iniciar
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Deshabilita la inicialización automática de scripts SQL
spring.sql.init.mode=never
# No altera ni genera el esquema de tablas en la base de datos automáticamente
spring.jpa.hibernate.ddl-auto=none
# Oculta la impresión de las sentencias SQL generadas por Hibernate en la consola
spring.jpa.show-sql=false
# Excluye del JSON resultante los campos cuyos valores sean null
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# 4. ACTUATOR
# ===================================================================
# Expone los endpoints de salud e información operativa mediante HTTP
management.endpoints.web.exposure.include=health,info
# Muestra el detalle completo del estado de salud de todos los componentes del sistema
management.endpoint.health.show-details=always

# ===================================================================
# 5. SEGURIDAD (SECURITY)
# ===================================================================
# Nombre de usuario para la autenticación HTTP Basic por defecto
spring.security.user.name=admin
# Contraseña para la autenticación HTTP Basic por defecto
spring.security.user.password=admin123
